<div class="fullscreen-container">
  <p-card 
    styleClass="card-container" 
    [style]="{ width: '350px', height: '400px', borderRadius: '15px', margin: 'auto' }">
    
    <ng-template pTemplate="header">
      <div class="header-text">Welcome to HealthCare</div>
    </ng-template>
    
    <div class="button-container">
      <p-button 
        label="Login" 
        icon="pi pi-sign-in" 
        (onClick)="login()" 
        styleClass="p-button-raised p-button-rounded full-width large-button">
      </p-button>
      
      <div class="divider"></div>
      
      <p-button 
        label="Sign Up" 
        icon="pi pi-user-plus" 
        (onClick)="signup()" 
        styleClass="p-button-outlined p-button-rounded full-width large-button">
      </p-button>
    </div>

    <!-- Checkbox de Política de Privacidade -->
    <div class="privacy-policy-container">
      <div class="checkbox-wrapper">
        <input 
          type="checkbox" 
          [(ngModel)]="isPolicyAccepted" 
          id="policyCheckbox" 
          class="privacy-checkbox" />
        <label for="policyCheckbox" class="privacy-policy-label">
          Eu aceito a 
          <a href="#" (click)="showPrivacyPolicy($event)">Política de Privacidade</a>
        </label>
      </div>
    </div>
  </p-card>
</div>

<!-- Modal de Política de Privacidade -->
<p-dialog 
  header="Política de Privacidade" 
  [(visible)]="displayPrivacyPolicy" 
  [modal]="true" 
  [closable]="true" 
  [style]="{ width: '50vw' }">
  <p>
    Aqui está o texto completo da Política de Privacidade. Leia atentamente antes de prosseguir.
  </p>
</p-dialog>
